<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAJPUT SURESHOT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 15%, rgba(218,170,60,0.15), transparent 35%),
        linear-gradient(180deg, #030303, #0b0b0b, #000);
    color: white;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

.top-title {
    color: #e7b84f;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 6px;
    margin-bottom: 8px;
}

.crown {
    font-size: 30px;
    margin-bottom: 10px;
}

.card {
    position: relative;

    padding: 22px 18px 28px;

    border-radius: 24px;

    background:
        linear-gradient(
            180deg,
            rgba(25,25,25,0.98),
            rgba(3,3,3,0.98)
        );

    border: 1px solid rgba(225,180,75,0.65);

    box-shadow:
        0 0 35px rgba(220,170,50,0.15),
        inset 0 0 25px rgba(255,255,255,0.03);
}

.card::before {
    content: "";
    position: absolute;

    inset: 7px;

    border-radius: 19px;

    border: 1px solid rgba(255,210,100,0.12);

    pointer-events: none;
}

.dp {
    width: min(88vw, 390px);
    aspect-ratio: 1 / 1;

    object-fit: cover;

    display: block;

    margin: 0 auto 20px;

    border-radius: 20px;

    border: 2px solid #dcae45;

    box-shadow:
        0 0 30px rgba(231,180,64,0.28);
}

.badge {
    display: inline-block;

    padding: 8px 15px;

    border-radius: 50px;

    background:
        linear-gradient(
            90deg,
            #8d641b,
            #f0c967,
            #8d641b
        );

    color: #080808;

    font-size: 12px;
    font-weight: 900;

    letter-spacing: 1px;

    margin-bottom: 12px;
}

h1 {
    margin: 4px 0 8px;

    font-size: clamp(34px, 10vw, 52px);

    letter-spacing: 2px;

    background:
        linear-gradient(
            #ffe39a,
            #c78920
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    text-shadow:
        0 2px 12px rgba(255,193,65,0.16);
}

.subtitle {
    font-size: 15px;

    font-weight: 800;

    letter-spacing: 2px;

    color: #f5f5f5;

    margin-bottom: 22px;
}

.stats {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 20px;
}

.stat {
    padding: 13px 8px;

    border-radius: 13px;

    background: #0d0d0d;

    border: 1px solid rgba(222,175,74,0.28);
}

.stat b {
    display: block;

    color: #e7bb61;

    font-size: 19px;

    margin-bottom: 4px;
}

.stat span {
    font-size: 11px;

    color: #bdbdbd;

    letter-spacing: 0.8px;
}

.buttons {
    display: grid;

    gap: 12px;
}

.btn {
    min-height: 54px;

    padding: 13px 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 13px;

    text-decoration: none;

    font-weight: 900;

    letter-spacing: 0.4px;

    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-2px);

    filter: brightness(1.08);
}

.primary {
    color: #080808;

    background:
        linear-gradient(
            135deg,
            #f6d57e,
            #b87b1e
        );

    box-shadow:
        0 8px 24px rgba(212,158,45,0.2);
}

.secondary {
    color: #f0c76b;

    background: #121212;

    border: 1px solid #79591f;
}

.note {
    margin-top: 17px;

    font-size: 11px;

    color: #777;

    line-height: 1.5;
}

/* Mobile */
@media (max-width: 400px) {

    body {
        padding: 12px;
    }

    .card {
        padding: 16px 12px 22px;
    }

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 12px;
    }

    .btn {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top-title">
        RAJPUT
    </div>

    <div class="crown">
        👑
    </div>

    <div class="card">

        <!-- RAJPUT DP -->
        <img
            class="dp"
            src="data:image/jpeg;base64,PASTE_YOUR_DP_BASE64_HERE"
            alt="Rajput Sureshot"
        >

        <div class="badge">
            👑 OFFICIAL VIP CHANNEL
        </div>

        <h1>
            RAJPUT SURESHOT
        </h1>

        <div class="subtitle">
            100% ACCURATE DAILY CALLS
        </div>

        <div class="stats">

            <div class="stat">
                <b>99.9%</b>
                <span>ACCURACY RATE</span>
            </div>

            <div class="stat">
                <b>DAILY</b>
                <span>SURESHOT CALLS</span>
            </div>

        </div>

        <div class="buttons">

            <a
                class="btn primary"
                href="https://t.me/+eCzGym29fms2M2I1"
                target="_blank"
            >
                JOIN TELEGRAM NOW • GET FREE CALLS
            </a>

            <a
                class="btn secondary"
                href="https://t.me/+pW1ll0bWzg0wNTE9"
                target="_blank"
            >
                📢 FOR PROMOTION OR ADS • CLICK HERE
            </a>

        </div>

        <div class="note">
            RAJPUT SURESHOT • OFFICIAL CHANNEL
        </div>

    </div>

</div>

</body>
</html>
