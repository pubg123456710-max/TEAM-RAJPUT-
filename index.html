<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
    radial-gradient(circle at 50% 5%,rgba(229,177,65,.16),transparent 30%),
    #030303;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.12;
    background-image:radial-gradient(#fff .5px,transparent .5px);
    background-size:18px 18px;
}

.wrap{
    width:min(100%,540px);
    margin:auto;
    padding:12px 12px 20px;
    position:relative;
}

.header{
    text-align:center;
    padding:2px 0 10px;
}

.brand{
    color:#efbf55;
    font-weight:900;
    letter-spacing:6px;
    font-size:18px;
}

.crown{
    font-size:30px;
    margin:5px 0 0;
}

.card{
    border:1px solid rgba(236,190,87,.55);
    border-radius:22px;
    padding:14px 12px 18px;

    background:
    linear-gradient(180deg,rgba(18,18,18,.98),rgba(5,5,5,.99));

    box-shadow:
    0 0 28px rgba(214,161,43,.12);
}

.hero{
    border:1px solid rgba(235,190,87,.3);
    border-radius:17px;
    padding:16px 10px;
    text-align:center;

    background:
    linear-gradient(145deg,#111,#070707);
}

.badge{
    display:inline-block;
    padding:7px 13px;
    border-radius:30px;

    background:
    linear-gradient(90deg,#a36e18,#f1c968,#a36e18);

    color:#090909;
    font-size:10px;
    font-weight:900;
    letter-spacing:.8px;
}

h1{
    margin:11px 0 6px;
    font-size:clamp(34px,10vw,50px);
    letter-spacing:1px;
    line-height:.95;

    background:
    linear-gradient(#ffe49a,#c7861b);

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.tagline{
    color:#eee;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:12px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.stat{
    padding:10px 6px;
    border:1px solid rgba(224,177,70,.22);
    border-radius:11px;
    background:#0b0b0b;
}

.stat b{
    display:block;
    color:#e8bd60;
    font-size:16px;
    margin-bottom:3px;
}

.stat span{
    font-size:9px;
    color:#aaa;
    letter-spacing:.6px;
}

.section-title{
    text-align:center;
    color:#f0c76b;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.5px;
    margin:15px 0 8px;
}

.features{
    display:grid;
    gap:6px;
}

.feature{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 10px;
    border-radius:11px;

    background:#0c0c0c;
    border:1px solid rgba(224,177,70,.16);
}

.icon{
    width:27px;
    height:27px;
    flex-shrink:0;

    border-radius:8px;

    display:grid;
    place-items:center;

    background:
    linear-gradient(135deg,#e8bd60,#8f5d14);

    color:#090909;
    font-size:12px;
    font-weight:900;
}

.feature b{
    font-size:11px;
}

.feature span{
    display:block;
    color:#999;
    font-size:9px;
    margin-top:1px;
}

.member-buttons{
    display:grid;
    gap:7px;
    margin-top:9px;
}

.btn{
    min-height:47px;
    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    font-weight:900;
    font-size:11px;
    letter-spacing:.3px;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.member{
    color:#080808;

    background:
    linear-gradient(135deg,#f7d981,#b87b1e);

    box-shadow:
    0 5px 15px rgba(211,157,39,.14);
}

/* PROMOTION */

.promo{
    margin-top:17px;
    padding:13px 11px;

    border-radius:15px;

    border:1px dashed rgba(235,190,87,.4);

    background:
    linear-gradient(180deg,#0d0d0d,#080808);

    text-align:center;
}

.promo h2{
    font-size:14px;
    color:#f1c76a;
    margin-bottom:4px;
}

.promo p{
    font-size:9px;
    color:#999;
    line-height:1.4;
    margin-bottom:8px;
}

.promo .btn{
    min-height:42px;
    background:#151515;
    color:#f1c76a;
    border:1px solid #76551c;
}

.footer{
    text-align:center;
    color:#666;
    font-size:8px;
    margin-top:9px;
    letter-spacing:.7px;
}

@media(max-width:390px){

    .wrap{
        padding:8px 9px 15px;
    }

    .card{
        padding:11px 9px 15px;
    }

    .crown{
        font-size:27px;
    }

    h1{
        font-size:37px;
    }

    .feature{
        padding:8px;
    }

    .btn{
        min-height:44px;
    }
}
</style>
